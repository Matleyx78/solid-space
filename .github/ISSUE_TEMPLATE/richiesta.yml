# and filled by the request script of the shared method: rename them in all
# three places at once.
name: Richiesta di Tecnigrafo
description: Un bisogno di Tecnigrafo che solid-space deve valutare. La apre il responsabile, o un agente di Tecnigrafo a cui lui lo chiede; dice che cosa serve, non come farlo.
title: "Richiesta: "
labels: ["richiesta"]
body:
  - type: markdown
    attributes:
      value: |
        Dice di che cosa Tecnigrafo ha bisogno, **non come soddisfarlo**: la scelta
        (OCCT così com'è, OCCT corretto, un pezzo nostro, oppure non spetta a
        solid-space) la fa solid-space con un ADR di valutazione. Regole e modello:
        [docs/richieste/0000-modello.md](https://github.com/Matleyx78/solid-space/blob/main/docs/richieste/0000-modello.md)
        e [ADR 0007](https://github.com/Matleyx78/solid-space/blob/main/docs/adr/0007-tappe-su-richiesta.md).

        Il titolo dice il bisogno in una frase, dopo «Richiesta: ». I campi sono
        tutti obbligatori. Ogni riferimento si scrive in forma assoluta:
        `Matleyx78/tecnigrafo#N` o `Matleyx78/solid-space#N`, mai `#N` da solo.
  - type: textarea
    id: da-dove-nasce
    attributes:
      label: Da dove nasce
      description: La tappa di Tecnigrafo e la issue, la pull request o la discussione in cui è emerso il bisogno, scritte come Matleyx78/tecnigrafo#N.
      placeholder: "Tappa 0.7 di Tecnigrafo (comandi di modifica), dal piano in Matleyx78/tecnigrafo#…"
    validations:
      required: true
  - type: textarea
    id: bisogno
    attributes:
      label: Il bisogno
      description: Che cosa Tecnigrafo non riesce a fare o fa male, e che cosa succede oggi. Niente soluzioni né interfacce desiderate.
    validations:
      required: true
  - type: textarea
    id: casi-concreti
    attributes:
      label: Casi concreti
      description: Situazioni reali con ingressi, file e sequenze di operazioni. Non sono i casi di verifica, che scrive solid-space in tests/corpus/.
    validations:
      required: true
  - type: textarea
    id: quando-soddisfatta
    attributes:
      label: Quando è soddisfatta
      description: Una condizione che Tecnigrafo può osservare. Diventa un criterio di chiusura della tappa.
    validations:
      required: true
  - type: textarea
    id: vincoli
    attributes:
      label: Vincoli
      description: Robustezza, prestazioni, sistemi operativi, dipendenze che Tecnigrafo non può avere. Un vincolo di interfaccia che esiste già si scrive come fatto.
    validations:
      required: true
  - type: textarea
    id: che-cosa-blocca
    attributes:
      label: Che cosa blocca
      description: Che cosa non può andare avanti in Tecnigrafo senza questa richiesta, e da quando; i pacchetti di Tecnigrafo che ne dipendono, come Matleyx78/tecnigrafo#N.
    validations:
      required: true
