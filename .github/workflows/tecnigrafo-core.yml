name: Tecnigrafo core

on:
  pull_request:
    paths:
      - 'robust/**'
      - 'geom2d/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/tecnigrafo-core.yml'

permissions:
  contents: read

concurrency:
  group: tecnigrafo-core-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tecnigrafo-core:
    name: Tecnigrafo core (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Tecnigrafo main
        uses: actions/checkout@v7
        with:
          repository: Matleyx78/tecnigrafo
          ref: main
          path: tecnigrafo
          submodules: false
          persist-credentials: false

      # Replace the uninitialised submodule with the exact PR revision.
      - name: Check out solid-space from this pull request
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: tecnigrafo/third_party/solid-space
          submodules: false
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev

      # The same two builds that Tecnigrafo runs towards solid-space
      # (Tecnigrafo docs/adr/0038, point 6): its "ci" preset (Debug) and its
      # "ci-release" preset (Release), both with warnings as errors, without
      # the desktop application.
      - name: Configure Tecnigrafo (Debug) without the desktop application
        working-directory: tecnigrafo
        run: cmake --preset ci -DTG_BUILD_APP=OFF

      - name: Build Tecnigrafo (Debug)
        working-directory: tecnigrafo
        run: cmake --build --preset ci --parallel "$(nproc)"

      - name: Test Tecnigrafo (Debug)
        working-directory: tecnigrafo
        run: ctest --preset ci --no-tests=error -j "$(nproc)"

      - name: Configure Tecnigrafo (Release) without the desktop application
        working-directory: tecnigrafo
        run: cmake --preset ci-release -DTG_BUILD_APP=OFF

      - name: Build Tecnigrafo (Release)
        working-directory: tecnigrafo
        run: cmake --build --preset ci-release --parallel "$(nproc)"

      - name: Test Tecnigrafo (Release)
        working-directory: tecnigrafo
        run: ctest --preset ci-release --no-tests=error -j "$(nproc)"
